# PocketAgent Configuration Example
# Connects Telegram & Discord to Claude Code, Codex, Antigravity (agy), and Grok

# Global default engine (claude | codex | agy | grok), switchable in chat via /engine
defaultEngine: "claude"

# Bot instances list (supports multiple bots across Telegram & Discord)
bots:
  # Telegram Bot
  - name: "my-telegram-bot"
    channel: telegram # telegram | discord
    token: "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ" # From @BotFather
    # allowFrom:
    #   - "1465542100"
    # groups:
    #   "-1003981923249": true

  # Optional Discord Bot
  # - name: "my-discord-bot"
  #   channel: discord
  #   token: "MTE3..."

# Optional: scheduled tasks (created by asking the bot in plain words, or via /cron)
# scheduler:
#   enabled: true
#   maxConcurrent: 2            # scheduled runs executing at the same time
#   defaultTimeoutMs: 1800000   # 30 min per run
#   catchUpGraceMs: 600000      # run a missed slot late only within 10 min, otherwise skip it
#   minIntervalMs: 300000       # reject schedules firing more often than every 5 min
#   maxJobsPerChat: 20
#   timezone: "Asia/Shanghai"   # defaults to the system timezone

# Optional: background jobs (long commands the agent hands off; it continues when they exit)
# jobs:
#   enabled: true
#   maxConcurrent: 4            # jobs running at the same time, across all chats
#   maxPerChat: 2               # running at the same time in one chat
#   maxQueuedPerChat: 3         # waiting for a slot in one chat
#   maxPerTurn: 2               # jobs one agent turn may start
#   defaultTimeoutMs: 21600000  # 6 h per job
#   maxTimeoutMs: 86400000      # longest timeout the agent may ask for (24 h)
#   historyLimit: 200           # finished jobs kept, with their logs

# Optional: chat messages the agent sends itself during a turn (POST /api/send-message)
# agentMessages:
#   maxPerTurn: 12              # per session and turn; further sends get HTTP 429
#   minIntervalMs: 800          # gap between two of them; faster calls wait
